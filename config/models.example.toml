# Phase 3 model config (EXAMPLE, nothing reads this in Phase 1).
# Copy to config/models.toml and edit. No secrets ever go in this file.
#
# Model tags below are placeholders. Confirm local tags with `ollama list`
# and the DeepSeek model id against DeepSeek's API docs before use.
#
# API keys: put the NAME of an environment variable in api_key_env. The harness
# reads it at call time and never stores or logs the value.
#   PowerShell (current session):  $env:DEEPSEEK_API_KEY = "..."
#   PowerShell (persist for user): [Environment]::SetEnvironmentVariable("DEEPSEEK_API_KEY", "...", "User")

[models.deepseek]
provider = "openai_compatible"
endpoint = "https://api.deepseek.com"
model = "deepseek-chat"            # placeholder; confirm
api_key_env = "DEEPSEEK_API_KEY"
roles = ["proposer"]
max_usd = 10.0                     # hard budget, enforced via ledger budget_event

[models.qwen-local]
provider = "ollama"
endpoint = "http://localhost:11434"
model = "qwen3:8b"                 # placeholder; confirm with `ollama list`
roles = ["proposer"]

[models.gemma-local]
provider = "ollama"
endpoint = "http://localhost:11434"
model = "gemma3:12b"               # placeholder; confirm with `ollama list`
roles = ["proposer"]

[models.granite-tiny]
provider = "ollama"
endpoint = "http://localhost:11434"
model = "granite-tiny"             # placeholder; confirm exact tag
roles = ["weighting", "triage"]
