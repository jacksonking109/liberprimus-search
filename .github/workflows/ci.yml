name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q

  windows-scripts:
    name: PowerShell scripts (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts\*.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 } else { Write-Host "all scripts parse (5.1)" }
      - name: Parse scripts with PowerShell 7
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts/*.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 } else { Write-Host "all scripts parse (7)" }
      - name: Run setup_windows.ps1 without models (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup_windows.ps1 -SkipModels -SkipTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content config\models.toml
          .\.venv\Scripts\lpswarm.exe doctor --models config\models.toml
          if (-not (Test-Path reports\dry\tiertest.md)) { Write-Host "dry run report missing"; exit 1 }
      - name: Overnight queue with a scripted supervisor (no publish)
        shell: powershell
        run: |
          @'
          [models.sup]
          provider = "scripted"
          model = "sup"
          roles = ["supervisor"]
          replies = ['{"actions": [{"type": "note", "text": "ci tick"}]}']
          '@ | Set-Content -Encoding ascii config\ci_models.toml
          @'
          [overnight]
          models = "config/ci_models.toml"
          supervisor = "sup"
          publish = false
          [[job]]
          id = "sw"
          kind = "swarm"
          args = ["--manifest", "data/lp/manifest.json", "--alphabet", "data/alphabet/gematria_primus.json", "--sections", "9", "--generators", "random_program", "--rounds", "1", "--null-samples", "200"]
          '@ | Set-Content -Encoding ascii config\ci_overnight.toml
          .\.venv\Scripts\lpswarm.exe overnight --config config\ci_overnight.toml --no-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sum = Get-ChildItem reports\overnight -Recurse -Filter SUMMARY.md | Select-Object -First 1
          Get-Content $sum.FullName
          if (-not (Select-String -Path $sum.FullName -Pattern "ci tick" -Quiet)) { Write-Host "supervisor note missing"; exit 1 }
      - name: start_ollama.ps1 -Stop runs cleanly without Ollama
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\start_ollama.ps1 -Stop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
